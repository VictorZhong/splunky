spring:
  application:
    name: splunky-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/splunky}
    username: ${DB_USER:splunky}
    password: ${DB_PASSWORD:splunky}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:8}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
  flyway:
    enabled: ${SPKY_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: spky_flyway_schema_history
    baseline-on-migrate: false
    placeholder-replacement: false
  jpa:
    hibernate:
      # Schema is owned by Flyway. JPA only validates that entities match.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC

server:
  port: ${SPKY_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.wpb.spky: DEBUG
    org.springframework.web.client: INFO

splunky:
  persistence:
    enabled: ${SPKY_PERSISTENCE_ENABLED:true}
  session:
    ttl-minutes: ${SPKY_SESSION_TTL_MINUTES:30}
    # Compatibility bridge for the current frontend mock, which generates a
    # session ID in browser storage before backend login is wired.
    accept-frontend-generated-sessions: ${SPKY_ACCEPT_FRONTEND_SESSIONS:false}
  llm:
    primary-provider: ${SPKY_LLM_PRIMARY_PROVIDER:COPILOT_PERSONAL}
    fallback-provider: ${SPKY_LLM_FALLBACK_PROVIDER:REMOTE_API}
    copilot:
      bootstrap-api-key: ${LLM_API_KEY:}
      bootstrap-session-token: ${COPILOT_SESSION_TOKEN:}
      model: ${LLM_MODEL:gpt-5.4}
      max-completion-tokens: ${LLM_MAX_OUTPUT_TOKENS:${LLM_MAX_COMPLETION_TOKENS:2048}}
      editor-version: ${COPILOT_EDITOR_VERSION:1.114.0}
      base-url: ${LLM_BASE_URL:https://api.githubcopilot.com}
      token-url: ${COPILOT_TOKEN_URL:https://api.github.com/copilot_internal/v2/token}
      # Full proxy URL for Copilot traffic, for example:
      # http://username:password@proxy-host:80
      # or base64 user-info:
      # http://base64:dXNlcm5hbWU6cGFzc3dvcmQ=@proxy-host:80
      # Percent-encode special characters in username/password.
      # If empty, proxy is disabled and requests go direct.
      proxy-url: ${LLM_PROXY_URL:}
    remote:
      base-url: ${REMOTE_LLM_BASE_URL:}
      api-key: ${REMOTE_LLM_API_KEY:}
      model: ${REMOTE_LLM_MODEL:gpt-5.4}
      max-completion-tokens: ${REMOTE_LLM_MAX_COMPLETION_TOKENS:2048}
  splunk:
    # Legacy single-endpoint defaults (used as fallback when env URL is missing)
    scheme: ${SPLUNK_SCHEME:https}
    host: ${SPLUNK_HOST:digital-splunk-search.hk.zzzz}
    port: ${SPLUNK_PORT:8089}
    # Environment routing
    default-environment: ${SPLUNK_DEFAULT_ENV:DEV}
    environments:
      DEV: ${SPLUNK_DEV_URL:https://digital-splunk-search.hk.zzzz:8089}
      PROD_ON_PREM: ${SPLUNK_PROD_ON_PREM_URL:https://splunk-onprem.example.com:8089}
      PROD_AWS: ${SPLUNK_PROD_AWS_URL:https://splunk-aws.example.com:8089}
    trust-all-ssl: ${SPLUNK_TRUST_ALL_SSL:true}
    job-ttl-seconds: ${SPLUNK_JOB_TTL_SECONDS:1800}
    max-auth-retry: ${SPLUNK_MAX_AUTH_RETRY:3}
    result-row-limit: ${SPLUNK_RESULT_ROW_LIMIT:0}
